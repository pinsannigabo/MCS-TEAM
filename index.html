<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microstent Geometry Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --bg:#EDEEF0;
    --panel:#F7F8F9;
    --panel-2:#EFF1F3;
    --line:#D6DADE;
    --accent:#0F5FA6;
    --accent-dark:#0B4A82;
    --accent-bg:#DCEBF8;
    --text:#20262C;
    --muted:#6B7480;
    --muted-2:#98A0A9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'Inter',sans-serif; overflow:hidden;}
  .app{display:flex; flex-direction:column; height:100vh;}

  /* ---- Title bar ---- */
  .titlebar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; border-bottom:1px solid var(--line);
    background:var(--panel);
    flex-shrink:0;
  }
  .brand{display:flex; align-items:baseline; gap:12px;}
  .brand h1{
    font-weight:700; font-size:17px;
    letter-spacing:0.01em; margin:0; color:var(--text);
  }
  .brand .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.1em;
    color:var(--accent-dark); text-transform:uppercase; border:1px solid var(--accent);
    background:var(--accent-bg);
    padding:3px 7px; border-radius:3px;
  }
  .titlebar .meta{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted-2);
  }

  /* ---- Layout ---- */
  .main{ flex:1; display:flex; min-height:0; }
  .sidebar{
    width:350px; flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--line); overflow-y:auto;
    display:flex; flex-direction:column;
  }
  .viewer{ flex:1; position:relative; background:
      radial-gradient(circle at 30% 20%, #F5F6F7 0%, #E2E5E8 75%);
  }
  #canvas-host{ position:absolute; inset:0; }

  /* ---- Shape selector ---- */
  .shape-selector{ padding:16px 16px 6px; }
  .section-label{
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.1em;
    color:var(--muted); text-transform:uppercase; margin:0 0 10px 2px;
  }
  .shape-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .shape-btn{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    color:var(--muted); padding:12px 8px; cursor:pointer; text-align:left;
    font-size:12.5px; font-weight:600;
    transition:border-color .15s, color .15s, background .15s;
    display:flex; flex-direction:column; gap:6px;
  }
  .shape-btn svg{ width:26px; height:26px; stroke:var(--muted); fill:none; stroke-width:1.6; }
  .shape-btn:hover{ border-color:var(--muted-2); color:var(--text); }
  .shape-btn.active{ border-color:var(--accent); color:var(--accent-dark); background:var(--accent-bg); }
  .shape-btn.active svg{ stroke:var(--accent-dark); }

  /* ---- Params ---- */
  .params{ padding:18px 16px; flex:1; }
  .param-row{ margin-bottom:14px; }
  .param-row .top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .param-row label{ font-size:12.5px; color:var(--text); font-weight:500;}
  .param-row .val{
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--accent-dark);
    background:var(--accent-bg); border:1px solid var(--accent);
    padding:1px 7px; border-radius:3px; min-width:52px; text-align:center;
  }
  input[type=range]{
    -webkit-appearance:none; width:100%; height:3px; background:var(--line);
    border-radius:2px; outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--accent); cursor:pointer; border:2px solid #fff;
    box-shadow:0 0 0 1px var(--accent);
  }
  input[type=range]::-moz-range-thumb{
    width:12px; height:12px; border-radius:50%; background:var(--accent);
    border:2px solid #fff; cursor:pointer;
  }

  .derived{
    margin-top:4px; padding:12px; background:#fff; border:1px solid var(--line);
    border-radius:6px; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--muted);
  }
  .derived div{ display:flex; justify-content:space-between; padding:3px 0; }
  .derived span.v{ color:var(--accent-dark); font-weight:600; }

  .iop-readout{
    margin-top:10px; padding:12px 13px; border-radius:6px; border:1px solid var(--line);
    background:#fff;
  }
  .iop-readout .label{
    font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--muted); margin-bottom:5px;
  }
  .iop-readout .row{ display:flex; align-items:baseline; justify-content:space-between; }
  .iop-readout .value{ font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; }
  .iop-readout .verdict{
    font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:600;
    letter-spacing:0.04em; padding:3px 8px; border-radius:3px; text-transform:uppercase;
  }
  .iop-readout .note{
    margin-top:6px; font-size:10.5px; color:var(--muted); line-height:1.4;
  }
  .iop-good{ border-color:#2E8B57; background:#EFFBF3; }
  .iop-good .value{ color:#1E6E42; }
  .iop-good .verdict{ background:#DCF3E4; color:#1E6E42; }
  .iop-warnhigh{ border-color:#C0392B; background:#FDF0EE; }
  .iop-warnhigh .value{ color:#A5301F; }
  .iop-warnhigh .verdict{ background:#FBDEDA; color:#A5301F; }
  .iop-warnlow{ border-color:#B8860B; background:#FDF7E8; }
  .iop-warnlow .value{ color:#8F6607; }
  .iop-warnlow .verdict{ background:#F7E9C2; color:#8F6607; }

  /* ---- Footer / export ---- */
  .footer{ padding:16px; border-top:1px solid var(--line); }
  .btn{
    width:100%; padding:12px; border-radius:6px; border:1px solid transparent;
    font-weight:600; font-size:13px;
    cursor:pointer; letter-spacing:0.01em; transition:opacity .15s, transform .1s;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--accent); color:#fff; margin-bottom:8px; }
  .btn-primary:hover{ background:var(--accent-dark); }
  .btn-ghost{ background:#fff; border-color:var(--line); color:var(--muted); }
  .btn-ghost:hover{ color:var(--text); border-color:var(--muted-2); }

  /* ---- Viewer overlays ---- */
  .viewer-tag{
    position:absolute; top:16px; left:18px; font-family:'JetBrains Mono',monospace;
    font-size:11px; color:var(--muted); letter-spacing:0.03em; pointer-events:none;
    background:rgba(255,255,255,0.75); padding:3px 8px; border-radius:3px;
  }
  .viewer-tag b{ color:var(--text); font-weight:600; }
  .viewer-hint{
    position:absolute; bottom:14px; left:18px; font-family:'JetBrains Mono',monospace;
    font-size:10.5px; color:var(--muted); pointer-events:none;
    background:rgba(255,255,255,0.75); padding:2px 7px; border-radius:3px;
  }
  .scale-badge{
    position:absolute; bottom:14px; right:18px; font-family:'JetBrains Mono',monospace;
    font-size:10.5px; color:var(--muted); text-align:right; pointer-events:none;
    background:rgba(255,255,255,0.75); padding:2px 7px; border-radius:3px;
  }
  .scale-badge b{ color:var(--accent-dark); }

  .toast{
    position:absolute; top:16px; right:18px; background:#fff;
    border:1px solid var(--accent); color:var(--accent-dark);
    font-family:'JetBrains Mono',monospace; font-size:11.5px; padding:8px 12px;
    border-radius:5px; opacity:0; transform:translateY(-6px);
    transition:opacity .2s, transform .2s; pointer-events:none;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
  }
  .toast.show{ opacity:1; transform:translateY(0); }
</style>
</head>
<body>
<div class="app">

  <div class="titlebar">
    <div class="brand">
      <h1>Microstent Geometry Studio</h1>
      <span class="eyebrow">Parametric CAD · STL Export</span>
    </div>
    <div class="meta">SCALE 1 UNIT = 1 mm</div>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="shape-selector">
        <p class="section-label">01 · Select base form</p>
        <div class="shape-grid" id="shapeGrid"></div>
      </div>

      <div class="params">
        <p class="section-label" style="margin-top:22px;">02 · Edit geometry</p>
        <div id="paramContainer"></div>
        <div class="iop-readout" id="iopBox"></div>
        <div class="derived" id="derivedBox"></div>
      </div>

      <div class="footer">
        <button class="btn btn-primary" id="exportBtn">Download edited STL</button>
        <button class="btn btn-ghost" id="resetBtn">Reset to control mesh</button>
      </div>
    </div>

    <div class="viewer">
      <div id="canvas-host"></div>
      <div class="viewer-tag">EDITING&nbsp; <b id="shapeTag">TUBULAR</b></div>
      <div class="viewer-hint">DRAG TO ORBIT · SCROLL TO ZOOM</div>
      <div class="scale-badge">UNITS <b>mm</b></div>
      <div class="toast" id="toast">STL exported</div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   SCENE SETUP
   ============================================================ */
const host = document.getElementById('canvas-host');
const scene = new THREE.Scene();
scene.background = null;

const camera = new THREE.PerspectiveCamera(42, host.clientWidth/host.clientHeight, 0.01, 100);
camera.position.set(2, 1.5, 2.2);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(host.clientWidth, host.clientHeight);
host.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(10, 14, 8);
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fd0ff, 0.35);
rim.position.set(-8, -4, -10);
scene.add(rim);

const grid = new THREE.GridHelper(4, 40, 0xC3C9CE, 0xDDE1E4);
grid.position.y = -0.9;
scene.add(grid);

const material = new THREE.MeshStandardMaterial({
  color: 0xB9C4CC, metalness:0.55, roughness:0.32, side: THREE.DoubleSide,
  flatShading: true
  // Genuinely faceted parts (the hex arms) need PER-TRIANGLE normals, not
  // smoothed ones -- smoothing across a real sharp edge is what produced
  // the banding/bright-shard artifact. flatShading computes each triangle's
  // normal from screen-space derivatives at render time, correct for any
  // topology, no geometry changes required. Round parts (the ball joint,
  // round tube shafts) are kept looking smooth instead by giving them a
  // high enough circumferential segment count that their facets are too
  // small to see, rather than by relying on normal-smoothing to hide them.
});
let mesh = new THREE.Mesh(new THREE.BufferGeometry(), material);
scene.add(mesh);

/* ---- minimal orbit controls (no addon dependency) ---- */
let isDragging=false, prevX=0, prevY=0, azimuth=0.8, polar=1.05, radius=3;
const target = new THREE.Vector3(0,0,0);
function updateCam(){
  const p = Math.max(0.15, Math.min(Math.PI-0.15, polar));
  camera.position.set(
    target.x + radius*Math.sin(p)*Math.sin(azimuth),
    target.y + radius*Math.cos(p),
    target.z + radius*Math.sin(p)*Math.cos(azimuth)
  );
  camera.lookAt(target);
}
updateCam();
renderer.domElement.addEventListener('pointerdown', e=>{ isDragging=true; prevX=e.clientX; prevY=e.clientY; });
window.addEventListener('pointerup', ()=> isDragging=false);
window.addEventListener('pointermove', e=>{
  if(!isDragging) return;
  const dx = e.clientX-prevX, dy = e.clientY-prevY;
  prevX=e.clientX; prevY=e.clientY;
  azimuth -= dx*0.006;
  polar   -= dy*0.006;
  updateCam();
});
renderer.domElement.addEventListener('wheel', e=>{
  e.preventDefault();
  radius = Math.max(0.15, Math.min(15, radius + e.deltaY*0.002));
  updateCam();
}, { passive:false });

window.addEventListener('resize', ()=>{
  camera.aspect = host.clientWidth/host.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(host.clientWidth, host.clientHeight);
});

(function animate(){ requestAnimationFrame(animate); renderer.render(scene, camera); })();

/* ============================================================
   HELPERS
   ============================================================ */
function smoothstep(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

/* ============================================================
   LIVE IOP ESTIMATOR — mirrors stent_resistance.py exactly:
   same Hagen-Poiseuille + Sampson end-orifice model, same Goldmann
   outflow-facility equation, same physiological constants. This is
   what lets the studio tell you *before you export* whether the
   current parameters land in the clinical target band.
   Every shape's innerFn (the LUMEN radius) is theta-independent by
   construction here — only the outer surface varies with theta for
   ribs/domes/ellipse cross-sections — so sampling at theta=0 is exact,
   not an approximation.
   ============================================================ */
const IOP_MODEL = {
  MU_AH: 7.2e-4,            // aqueous humour dynamic viscosity, Pa*s
  F_IN: 2.5, F_UVEO: 1.2,   // uL/min
  P_EV: 9.0,                // mmHg
  C_TM_GLAUCOMA: 0.08,      // uL/(min*mmHg)
  C_DISTAL: 0.30, F_SECTOR: 0.35,
  FAC_SI: (1e-9/60)/133.322 // 1 uL/(min*mmHg) -> m^3/(Pa*s)
};

function estimateIOPFromShape(curve, innerFn, nSamples, fSectorOverride){
  nSamples = nSamples || 400;
  const fSector = (fSectorOverride !== undefined) ? fSectorOverride : IOP_MODEL.F_SECTOR;
  const totalLenMM = curve.getLength();
  if(!(totalLenMM > 0)) return null;
  const totalLenM = totalLenMM * 1e-3;
  const ds = totalLenM / nSamples;
  const SOLID_EPS_MM = 1e-4; // below this, treat as genuinely solid (no lumen), not near-zero
  let R_pois = 0, rFirst = null, rLast = null;
  for(let i=0;i<nSamples;i++){
    const u = (i+0.5)/nSamples;
    const rMM = innerFn(u, 0);
    if(rMM < SOLID_EPS_MM) continue; // solid here -- excluded from the flow path, not integrated
    const r = rMM * 1e-3; // mm -> m
    if(rFirst===null) rFirst = r;
    rLast = r;
    const A = Math.PI*r*r;
    R_pois += 8*Math.PI*IOP_MODEL.MU_AH*ds/(A*A);
  }
  if(rFirst===null || rFirst<=1e-8 || rLast<=1e-8) return null;
  const R_ends = 3*IOP_MODEL.MU_AH/Math.pow(rFirst,3) + 3*IOP_MODEL.MU_AH/Math.pow(rLast,3);
  const R = R_pois + R_ends;
  const C_lumen = (1/R)/IOP_MODEL.FAC_SI;
  const C_distal_eff = IOP_MODEL.C_DISTAL*fSector;
  const C_shunt = 1/(1/C_lumen + 1/C_distal_eff);
  const C = IOP_MODEL.C_TM_GLAUCOMA + C_shunt;
  const IOP = IOP_MODEL.P_EV + (IOP_MODEL.F_IN-IOP_MODEL.F_UVEO)/C;
  return { IOP, R, C_lumen };
}

/* ============================================================
   GEOMETRY ENGINE — swept hollow-annulus tube.
   outerFn/innerFn now take (u, theta) so cross-sections can vary
   both along the sweep AND around the circumference (needed for
   ribs, flanges, and directional window cutouts).
   ============================================================ */
function buildHollowTube(curve, opts){
  const segments = opts.segments || 110;
  const radial   = opts.radial   || 36;
  const outerFn  = opts.outerFn;
  const innerFn  = opts.innerFn;
  // Optional: holeTest(u, theta) -> true means "material fully removed here".
  // Where a whole grid cell's 4 corners test true, that patch of wall is
  // skipped entirely (both outer and inner faces), and a connecting
  // "throat" wall is stitched in along the boundary between removed and
  // solid cells so the cut reads as an actual hole clean through the wall
  // (visually AND in the exported STL), not just a thinned dimple.
  const holeTest = opts.holeTest || null;

  const frames = curve.computeFrenetFrames(segments, false);
  const pts    = curve.getSpacedPoints(segments);
  const { normals, binormals } = frames;

  const outerRows = [], innerRows = [], holeMask = [];
  for(let i=0;i<=segments;i++){
    const u = i/segments;
    const p = pts[i], N = normals[i], B = binormals[i];
    const oRow=[], iRow=[], hRow=[];
    for(let j=0;j<=radial;j++){
      const th = (j/radial)*Math.PI*2;
      const c = Math.cos(th), s = Math.sin(th);
      const nx = N.x*c + B.x*s, ny = N.y*c + B.y*s, nz = N.z*c + B.z*s;
      const rO = Math.max(0.0006, outerFn(u, th));
      const rI = Math.max(0, Math.min(rO-0.001, innerFn(u, th)));
      oRow.push(new THREE.Vector3(p.x+nx*rO, p.y+ny*rO, p.z+nz*rO));
      iRow.push(new THREE.Vector3(p.x+nx*rI, p.y+ny*rI, p.z+nz*rI));
      hRow.push(holeTest ? !!holeTest(u, th) : false);
    }
    outerRows.push(oRow); innerRows.push(iRow); holeMask.push(hRow);
  }

  const pos = [];
  const tri = (a,b,c)=> pos.push(a.x,a.y,a.z, b.x,b.y,b.z, c.x,c.y,c.z);

  // A "cell" is the quad patch between grid rows i/i+1 and columns j/j+1.
  // It's a hole cell only if ALL 4 corners test inside the hole, so the
  // cut boundary follows the grid resolution — bump segments/radial on
  // shapes with holes for a cleaner edge. j wraps around the circumference.
  function cellIsHole(i, jRaw){
    if(i<0 || i>=segments) return false;
    const j = ((jRaw % radial) + radial) % radial;
    return holeMask[i][j] && holeMask[i][j+1] && holeMask[i+1][j] && holeMask[i+1][j+1];
  }

  for(let i=0;i<segments;i++){
    for(let j=0;j<radial;j++){
      if(cellIsHole(i,j)) continue; // material fully removed — no outer/inner skin here

      const a=outerRows[i][j], b=outerRows[i+1][j], c=outerRows[i+1][j+1], d=outerRows[i][j+1];
      tri(a,b,c); tri(a,c,d);
      const A=innerRows[i][j], B_=innerRows[i+1][j], C=innerRows[i+1][j+1], D=innerRows[i][j+1];
      tri(A,C,B_); tri(A,D,C);

      if(!holeTest) continue;
      // Stitch a throat wall (outer edge -> inner edge) along any side of
      // this solid cell that borders a removed cell, so the hole actually
      // opens all the way through the wall thickness instead of leaving a
      // disconnected gap.
      if(cellIsHole(i-1,j)){
        const oa=outerRows[i][j], ob=outerRows[i][j+1], ia=innerRows[i][j], ib=innerRows[i][j+1];
        tri(oa, ob, ib); tri(oa, ib, ia);
      }
      if(cellIsHole(i+1,j)){
        const oa=outerRows[i+1][j], ob=outerRows[i+1][j+1], ia=innerRows[i+1][j], ib=innerRows[i+1][j+1];
        tri(oa, ob, ib); tri(oa, ib, ia);
      }
      if(cellIsHole(i,j-1)){
        const oa=outerRows[i][j], ob=outerRows[i+1][j], ia=innerRows[i][j], ib=innerRows[i+1][j];
        tri(oa, ob, ib); tri(oa, ib, ia);
      }
      if(cellIsHole(i,j+1)){
        const oa=outerRows[i][j+1], ob=outerRows[i+1][j+1], ia=innerRows[i][j+1], ib=innerRows[i+1][j+1];
        tri(oa, ob, ib); tri(oa, ib, ia);
      }
    }
  }
  for(let j=0;j<radial;j++){
    const oA=outerRows[0][j], oB=outerRows[0][j+1], iA=innerRows[0][j], iB=innerRows[0][j+1];
    tri(oA, iA, iB); tri(oA, iB, oB);
    const oA2=outerRows[segments][j], oB2=outerRows[segments][j+1], iA2=innerRows[segments][j], iB2=innerRows[segments][j+1];
    tri(oA2, oB2, iB2); tri(oA2, iB2, iA2);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  return geo;
}

/* Merge several BufferGeometry position arrays into one. Used to combine
   a fully-SOLID tip piece with a separately-built OPEN-channel body piece
   -- see the long comment above the L-shaped and Optimized build()
   functions for why these must be genuinely separate meshes, not one
   swept tube with a function that "jumps" partway through. */
function mergeGeometries(geos){
  let total = 0;
  for(const g of geos) total += g.attributes.position.array.length;
  const merged = new Float32Array(total);
  let offset = 0;
  for(const g of geos){
    merged.set(g.attributes.position.array, offset);
    offset += g.attributes.position.array.length;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(merged, 3));
  out.computeVertexNormals();
  return out;
}

/* Wraps an existing curve, exposing only the sub-range [t0,t1] as an
   independent curve running from local 0 to 1. Lets buildHollowTube
   sweep a piece of a curve (e.g. "everything past the solid tip") with
   its own clean ring sampling, with NO shared rings against the
   adjacent piece -- which is exactly what avoids the ramp-through-zero
   bug (see comment above build() in lshaped/optimized). */
class SubCurve extends THREE.Curve{
  constructor(parent, t0, t1){ super(); this.parent=parent; this.t0=t0; this.t1=t1; }
  getPoint(t, target=new THREE.Vector3()){
    const gt = this.t0 + t*(this.t1-this.t0);
    return this.parent.getPoint(gt, target);
  }
}

/* Custom arc curve for the crescent form */
class ArcCurve3 extends THREE.Curve{
  constructor(radius, angleRad){ super(); this.radius=radius; this.angle=angleRad; }
  getPoint(t, target=new THREE.Vector3()){
    const a = (t-0.5)*this.angle;
    const x = this.radius*Math.sin(a);
    const y = this.radius*(1-Math.cos(a));
    return target.set(x, y, 0);
  }
}

/* Custom L-shaped curve for the L-shaped form: a straight blade segment,
   a quarter-circle bend, then a straight vertical socket segment. */
class LShapeCurve3 extends THREE.Curve{
  constructor(bladeLength, bendRadius, socketLength, bendAngleRad){
    super();
    this.bladeLength  = Math.max(0.001, bladeLength);
    this.bendRadius   = Math.max(0.015, bendRadius);
    this.socketLength = Math.max(0.001, socketLength);
    this.bendAngle = bendAngleRad !== undefined ? bendAngleRad : Math.PI/2;
    this.arcLen  = this.bendRadius * this.bendAngle;
    this.total   = this.bladeLength + this.arcLen + this.socketLength;
    this.tBladeEnd = this.bladeLength / this.total;
    this.tArcEnd   = this.tBladeEnd + this.arcLen / this.total;
  }
  getPoint(t, target=new THREE.Vector3()){
    const bl = this.bladeLength, R = this.bendRadius, sl = this.socketLength, BA = this.bendAngle;
    if(t <= this.tBladeEnd){
      const s = this.tBladeEnd>0 ? t/this.tBladeEnd : 0;
      return target.set(bl*s, 0, 0);
    } else if(t <= this.tArcEnd){
      const span = this.tArcEnd - this.tBladeEnd;
      const u2 = span>0 ? (t-this.tBladeEnd)/span : 0;
      const a = u2*BA;
      return target.set(bl + R*Math.sin(a), R - R*Math.cos(a), 0);
    } else {
      const span = 1 - this.tArcEnd;
      const u3 = span>0 ? (t-this.tArcEnd)/span : 0;
      const endX = bl + R*Math.sin(BA), endY = R - R*Math.cos(BA);
      const dirX = Math.cos(BA), dirY = Math.sin(BA); // tangent direction where the arc lets off
      return target.set(endX + dirX*sl*u3, endY + dirY*sl*u3, 0);
    }
  }
}

      // Quantization guard: with a fixed radial grid, two holes centered
      // at different angles can snap to a different number of grid cells
      // (e.g. 4 vs 5) even when given the identical requested width, which
      // reads as "the holes aren't the same size". Snapping every hole's
      // width AND center to whole grid-cell multiples guarantees every
      // hole gets the exact same cell footprint, so sizes match exactly.
      const coneRadialSegments = 108; // must match the `radial` value passed to buildHollowTube below
      const deltaTheta = (Math.PI*2) / coneRadialSegments;
      const fHoleThetaWidth = Math.max(1, Math.round(rawThetaWidth/deltaTheta)) * deltaTheta;
      // Evenly divide the spread arc into fHoleN equal slices and center a
      // hole in each slice — this keeps spacing (and therefore size, since
      // every hole uses the same thetaWidth) uniform even when the spread
      // wraps a full 360°, where the old center-to-center/(n-1) formula
      // double-counted the seam and left an uneven gap.
      const holeThetas = [];
      const thetaStep = fHoleN>0 ? totalSpreadRad/fHoleN : 0;

        let c = -totalSpreadRad/2 + thetaStep*(k+0.5);
        c = Math.round(c/deltaTheta) * deltaTheta; // snap center to the same grid every hole shares
        holeThetas.push(c);

      function flangeHoleTest(u, theta){
        if(fHoleR<=0 || holeThetas.length===0 || fHoleUHalfWidth<=0) return false;

      const innerFn = (u)=> Math.max(0, coneInnerAt(u));
      const geometry = buildHollowTube(curve, {
        segments: 150, radial: coneRadialSegments,
        outerFn, innerFn, holeTest: flangeHoleTest

  lshaped: {

    params:[

      {key:'bladeWidth', label:'Blade width', min:0.05, max:0.9, step:0.01, unit:'mm'},

      {key:'ridgeHeight', label:'Ridge/dome height', min:0, max:0.15, step:0.005, unit:'mm'},
      {key:'holeDiameter', label:'Flute hole Ø (through each dome)', min:0, max:0.15, step:0.005, unit:'mm'},
      {key:'bendRadius', label:'Bend radius', min:0.02, max:0.6, step:0.01, unit:'mm'},
      {key:'bendAngle', label:'Bend angle', min:20, max:150, step:1, unit:'\u00b0'},
      {key:'socketDiameter', label:'Socket Ø', min:0.05, max:1.0, step:0.01, unit:'mm'},
      {key:'wallThickness', label:'Socket wall thickness', min:0.01, max:0.25, step:0.005, unit:'mm'},

    ],
    build(v){
      const curve = new LShapeCurve3(v.bladeLength, v.bendRadius, v.socketLength, THREE.MathUtils.degToRad(v.bendAngle));
      const tBladeEnd = curve.tBladeEnd;
      const tArcEnd   = curve.tArcEnd;
      const tipFrac = 0.06; // fraction of the BLADE (not whole curve) held crisply solid at the tip
      const n = Math.max(0, Math.round(v.ridgeCount));
      const rx = v.bladeWidth/2, ry = v.bladeDepth/2;
      const socketR = v.socketDiameter/2;
      const lumenR = Math.max(0, socketR - v.wallThickness);
      // Internal channel running through the blade, connecting the rivet
      // holes to the socket's hollow bore (per: "holes connect to the
      // cylinder arm"). It tapers to solid near the pointed tip, same as
      // the outer taper, so the tip itself stays solid.
      const bladeChannelR = Math.min(lumenR, ry*0.42);

      // The blade+bend curve is flat (lies in one plane), so its Frenet
      // frame has one axis that stays FIXED the whole way (out-of-plane,
      // "B" — this is what bladeDepth/ry rides on) and one axis that
      // ROTATES as the curve turns through the bend (in-plane, "N" — this
      // is what bladeWidth/rx rides on). Ridges must be pinned to the
      // fixed B axis (theta = 90°) so they stay on the same flat face the
      // whole length of the blade. Pinning them to N (theta = 0°, the old
      // bug) made them trace the rotating axis instead — that's what
      // produced the drill-bit/auger spiral through the bend.
      const ridgeAxis = Math.PI/2;

      // Pressure/vent holes sit AT each rivet's dome peak (not in the
      // flat groove between rivets) and open straight down into the
      // hollow channel — a raised dome with a hole through it, flute-
      // tonehole style.
      const holeR = Math.max(0, v.holeDiameter/2);
      const period = n>0 ? 1/n : 0;
      const ridgeCenters = []; // bump/dome peaks, in uBladeLocal units (0..1)
      if(n>0){
        for(let i=0;i<n;i++){
          ridgeCenters.push(tipFrac + (1-tipFrac)*((i+0.5)*period));
        }
      }
      const holeUHalfWidth  = v.bladeLength>0 ? Math.max(holeR*1.1, 0.01)/v.bladeLength : 0;
      const holeThetaWidth  = clamp(holeR/Math.max(ry,0.02), 0.12, 1.4);
      function ridgeHoleTest(uGlobal, theta){
        if(holeR<=0 || ridgeCenters.length===0 || holeUHalfWidth<=0) return false;
        if(uGlobal > tBladeEnd) return false; // holes only live in the blade zone
        const uBladeLocal = tBladeEnd>0 ? uGlobal/tBladeEnd : 0;
        if(uBladeLocal<=tipFrac) return false;
        let dth = Math.abs(theta - ridgeAxis); if(dth>Math.PI) dth = 2*Math.PI-dth;
        if(dth>=holeThetaWidth) return false;
        for(const c of ridgeCenters){
          if(Math.abs(uBladeLocal-c) < holeUHalfWidth) return true;
        }
        return false;
      }

      function bladeRadius(uBladeLocal, theta){
        const tipTaper = smoothstep(clamp(uBladeLocal/tipFrac,0,1));
        let rBlade = 1/Math.sqrt( Math.pow(Math.cos(theta)/Math.max(rx,0.005),2) + Math.pow(Math.sin(theta)/Math.max(ry,0.005),2) );
        let ridgeBump = 0;
        if(n>0 && uBladeLocal>tipFrac){
          const zoneT = (uBladeLocal-tipFrac)/(1-tipFrac);
          const period = 1/n;
          const localT = (zoneT % period)/period;
          const bumpShape = Math.pow(Math.sin(localT*Math.PI), 2);
          const topFacing = Math.max(0, Math.sin(theta)); // fixed B axis, not rotating N
          ridgeBump = v.ridgeHeight*bumpShape*topFacing;
        }
        let r = rBlade*tipTaper + ridgeBump;
        return Math.max(0.015, r);
      }

      // ------------------------------------------------------------
      // TWO SEPARATE MESHES, not one swept tube with a function that
      // "jumps" partway through.
      //
      // A prior version tried to get a crisp solid-to-open transition by
      // making innerFn() jump from 0 to bladeChannelR at u=tipFrac. That
      // is a real step in the MATH, but buildHollowTube samples the
      // function at discrete rings and linearly interpolates the 3D mesh
      // BETWEEN them -- so a step in the sampled function becomes a RAMP
      // spanning exactly one mesh segment, and that ramp still passes
      // through r=0. When the exported STL is sliced by
      // stent_resistance.py, a single unlucky slice landing inside that
      // ~9 um ramp can report a radius of a few micrometres, and because
      // resistance scales as 1/area^2, that one slice alone can dominate
      // the entire computed resistance (verified: one such slice
      // reproduced ~120% of a real reported R_Poiseuille on this exact
      // geometry). Short version: the fix has to remove the ramp from
      // the TRIANGLE MESH, not just from the parametric function.
      //
      // Fix: build the solid tip (u in [0, tipFrac] of the blade) as its
      // OWN independent tube with innerFn == 0 identically -- no lumen
      // at all, so there is nothing to ramp through zero. Build the rest
      // (open channel through blade + bend + socket) as a SEPARATE
      // independent tube whose first ring is already at full bore. The
      // two meshes share no rings, so there is no interpolation between
      // "closed" and "open" anywhere -- just two solids meeting at a
      // shared face.
      // ------------------------------------------------------------
      const uBoundary = tipFrac*tBladeEnd; // global u where solid ends / open begins

      const outerFnFull = (u,theta)=>{
        if(u <= tBladeEnd){
          const uBladeLocal = tBladeEnd>0 ? u/tBladeEnd : 0;
          return bladeRadius(uBladeLocal, theta);
        } else if(u <= tArcEnd){
          const bladeTipR = bladeRadius(1, theta);
          const blend = smoothstep(tArcEnd>tBladeEnd ? (u-tBladeEnd)/(tArcEnd-tBladeEnd) : 1);
          return THREE.MathUtils.lerp(bladeTipR, socketR, blend);
        } else {
          return socketR;
        }
      };

      // -- Piece 1: the solid tip. No lumen anywhere in this piece. --
      const tipCurve = new SubCurve(curve, 0, uBoundary);
      const tipOuterFn = (uLocal, theta)=> outerFnFull(uLocal*uBoundary, theta);
      const tipInnerFn = ()=> 0; // genuinely, always solid -- not a taper toward zero
      const geoTip = buildHollowTube(tipCurve, {
        segments: 24, radial: 96,
        outerFn: tipOuterFn, innerFn: tipInnerFn
      });

      // -- Piece 2: the open channel -- blade remainder + bend + socket.
      // Its FIRST ring (bodyLocal=0) is already at full bladeChannelR --
      // nothing ramps up from zero because there is no zero here at all. --
      const bodyCurve = new SubCurve(curve, uBoundary, 1);
      const bodyOuterFn = (uLocal, theta)=> outerFnFull(uBoundary + uLocal*(1-uBoundary), theta);
      const bodyInnerFn = (uLocal, theta)=>{
        const u = uBoundary + uLocal*(1-uBoundary);
        if(u <= tBladeEnd) return bladeChannelR; // constant -- this piece is entirely past the tip
        if(u <= tArcEnd){
          const blend = smoothstep(tArcEnd>tBladeEnd ? (u-tBladeEnd)/(tArcEnd-tBladeEnd) : 1);
          return THREE.MathUtils.lerp(bladeChannelR, lumenR, blend);
        }
        return lumenR;
      };
      const bodyHoleTest = (uLocal, theta)=> ridgeHoleTest(uBoundary + uLocal*(1-uBoundary), theta);
      const geoBody = buildHollowTube(bodyCurve, {
        segments: 160, radial: 96,
        holeTest: bodyHoleTest,
        outerFn: bodyOuterFn, innerFn: bodyInnerFn
      });

      const geometry = mergeGeometries([geoTip, geoBody]);
      // IOP estimate: sample only the OPEN piece's curve+function (the
      // solid tip correctly contributes nothing to the flow path).
      const iopEstimate = estimateIOPFromShape(bodyCurve, bodyInnerFn);
      return { geometry, iop: iopEstimate };
    },
    derived(v){
      const overall = v.bladeLength + v.bendRadius*THREE.MathUtils.degToRad(v.bendAngle) + v.socketLength;
      const n = Math.max(0, Math.round(v.ridgeCount));
      const holes = v.holeDiameter>0 ? n : 0;
      return {
        'Bend angle': v.bendAngle.toFixed(0)+' deg',
        'Overall length (unrolled)': overall.toFixed(3)+' mm',
        'Lumen diameter': Math.max(0, v.socketDiameter-2*v.wallThickness).toFixed(3)+' mm',
        'Flute holes': holes+' through domes, open to lumen'
      };
    }
  },

  /* ---- OPTIMIZED: ball-joint hub with two hex-faceted tapered arms,
     styled after the segmented microbot reference (spherical pivot,
     faceted shaft, pointed ends). Visual form changed; the underlying
     verified physics did NOT -- the internal bore is still a constant-
     radius circular channel running through the ball and most of each
     arm, sized and lengthed to sit in the same tolerance-robust flat
     plateau as before (a simultaneous +-15% error on every dimension
     leaves predicted IOP unchanged to 2 decimal places).

     The tapered tips are CRISPLY solid (zero lumen radius, not an
     asymptotic taper) starting at tipTaperFrac along each arm -- the
     exact same fix applied to the L-shaped stent's channel, applied
     here pre-emptively. A channel that mathematically tapers to zero
     radius over a nonzero length is a non-integrable singularity in
     any downstream resistance analysis (COMSOL or the STL script
     alike); a crisp cutoff to genuinely-solid avoids it outright
     rather than tuning around it. ---- */
  optimized: {
    label:'Optimized', tag:'OPTIMIZED',
    icon:`<circle cx="12" cy="12" r="2.6"></circle><path d="M9.8 10.8L4 5"></path><path d="M4 5l5-.6M4 5l.6 5"></path><path d="M14.2 10.8L20 5"></path><path d="M20 5l-5-.6M20 5l-.6 5"></path><path d="M9.8 13.2L4 19"></path><path d="M4 19l5 .6M4 19l.6-5"></path><path d="M14.2 13.2L20 19"></path><path d="M20 19l-5 .6M20 19l-.6-5"></path>`,
    control:{ armLength:0.30, ballDiameter:0.20, shaftDiameter:0.26,
              wallThickness:0.06, tipTaperFrac:0.58, facetDepth:1.00 },
    params:[
      {key:'armLength', label:'Arm length (each side)', min:0.1, max:0.8, step:0.01, unit:'mm'},
      {key:'ballDiameter', label:'Ball joint Ø', min:0.06, max:0.5, step:0.01, unit:'mm'},
      {key:'shaftDiameter', label:'Shaft Ø (across flats)', min:0.08, max:0.6, step:0.005, unit:'mm'},
      {key:'wallThickness', label:'Wall thickness', min:0.02, max:0.2, step:0.005, unit:'mm'},
      {key:'tipTaperFrac', label:'Tip taper (fraction of arm)', min:0.1, max:0.6, step:0.01, unit:''},
      {key:'facetDepth', label:'Hex facet depth', min:0, max:0.6, step:0.01, unit:''},
    ],
    build(v){
      const ballR = v.ballDiameter/2;
      const armLen = v.armLength;
      const total = v.ballDiameter + 2*armLen;
      const curve = new THREE.LineCurve3(new THREE.Vector3(-total/2,0,0), new THREE.Vector3(total/2,0,0));
      const shaftR = v.shaftDiameter/2;
      const lumenR = Math.max(0, shaftR - v.wallThickness);
      const tipFrac = clamp(v.tipTaperFrac, 0.05, 0.9);
      // blendFrac=0.12 (the original value) let the ball's own spherical
      // profile pinch down to ~48um right where it starts blending into
      // the hex shaft -- NARROWER than the 70um bore itself, silently
      // forcing the lumen to neck down through the ball (found via a
      // direct scan of every inner-radius value buildHollowTube actually
      // computes, not just the smooth estimator function -- see the long
      // comment above build() in the L-shaped stent for why that
      // distinction matters). 0.60 starts the blend later, while the
      // sphere is still comfortably wider than the bore, at every ball
      // size this shape is likely to use.
      const blendFrac = 0.60; // fraction of arm length used to blend ball -> hex shaft

      const tipR = shaftR*0.27; // small BLUNT tip radius, never a sharp point
      function hexR(theta, baseR){
        // TRUE flat-faced hexagon (straight facets, sharp edges) --
        // not a smooth ripple, which reads as a flower/gear instead of
        // a hex prism. Standard regular-N-gon radius-vs-angle formula:
        // r(t) = apothem / cos(t), t = angle from the nearest face's
        // normal direction, |t| <= pi/N. For N=6, |t| <= 30 deg, so
        // cos(t) stays in [cos(30deg), 1] -- always positive and well
        // clear of zero, no asymptote to worry about.
        const N = 6, seg = (2*Math.PI)/N;
        let t = ((theta % seg) + seg) % seg;
        t -= seg/2; // centre the flat face at t=0
        const trueHex = baseR * Math.cos(Math.PI/N) / Math.cos(t);
        return baseR*(1-v.facetDepth) + trueHex*v.facetDepth;
      }

      // s = signed distance from the model's centre, in mm. The arm
      // tapers CONTINUOUSLY along its whole length -- wide at the ball,
      // narrowing all the way to a small blunt tip -- rather than a
      // constant-width shaft with a short point tacked on at the end.
      function radiusAt(d){ // d = distance into the arm, 0 at ball surface
        const t = clamp(d/armLen, 0, 1);
        return THREE.MathUtils.lerp(shaftR, tipR, t); // straight (linear) taper, a true frustum
      }
      function outerAt(sAbs, theta){
        if(sAbs <= ballR){
          const sphereR = Math.sqrt(Math.max(0, ballR*ballR - sAbs*sAbs));
          const blendStart = ballR*(1-blendFrac);
          if(sAbs <= blendStart) return sphereR;
          const t = smoothstep((sAbs-blendStart)/(ballR-blendStart));
          return THREE.MathUtils.lerp(sphereR, hexR(theta, shaftR), t);
        }
        const d = sAbs - ballR;
        return hexR(theta, radiusAt(d));
      }
      // The open lumen zone ends well before the outer taper narrows down
      // near lumenR -- tipFrac now controls how much of the (already-
      // narrowing) arm stays solid, chosen so the wall never gets
      // dangerously thin right at the crisp cutoff.
      const tipStart = armLen*(1-tipFrac);
      function innerAt(sAbs){
        if(sAbs <= ballR) return lumenR; // open all the way through the ball
        const d = sAbs - ballR;
        if(d <= tipStart) return lumenR;
        return 0; // crisply solid from here to the tip -- see comment above build()
      }

      // ------------------------------------------------------------
      // THREE SEPARATE MESHES (left solid tip / open body through the
      // ball / right solid tip), not one swept tube with innerAt()
      // jumping from lumenR to 0 partway along each arm.
      //
      // Same root cause as the L-shaped fix above: buildHollowTube
      // linearly interpolates the 3D mesh between adjacent sampled
      // rings, so a step in innerAt() becomes a short RAMP through r=0
      // in the actual triangle mesh -- and a single STL slice landing
      // inside that ramp can dominate the whole computed resistance
      // (verified on the L-shaped stent; the exact same construction
      // was used here, so it carried the same latent bug even though
      // this shape's OWN reported IOP looked only mildly, not
      // catastrophically, off -- the ramp is shorter here, but the
      // underlying flaw is identical and not something to leave in
      // place). Splitting into genuinely separate solid/open meshes
      // removes the ramp from the geometry entirely, the same fix as
      // above, applied symmetrically to both arms.
      // ------------------------------------------------------------
      const openHalfSpan = ballR + tipStart;       // sAbs range that's open, each side
      const uLeftBoundary  = 0.5 - openHalfSpan/total;
      const uRightBoundary = 0.5 + openHalfSpan/total;

      const outerFnFull = (u, theta)=>{
        const sAbs = Math.abs((u-0.5)*total);
        return Math.max(0.012, outerAt(sAbs, theta));
      };

      const tipLeftCurve  = new SubCurve(curve, 0, uLeftBoundary);
      const tipLeftOuter  = (uLocal, theta)=> outerFnFull(uLocal*uLeftBoundary, theta);
      const tipLeftInner  = ()=> 0;
      const geoTipLeft = buildHollowTube(tipLeftCurve, {
        segments: 30, radial: 48, outerFn: tipLeftOuter, innerFn: tipLeftInner
      });

      const bodyCurve = new SubCurve(curve, uLeftBoundary, uRightBoundary);
      const bodyOuter = (uLocal, theta)=> outerFnFull(uLeftBoundary + uLocal*(uRightBoundary-uLeftBoundary), theta);
      const bodyInner = ()=> lumenR; // constant -- this piece is entirely within the open region
      const geoBody = buildHollowTube(bodyCurve, {
        segments: 140, radial: 48, outerFn: bodyOuter, innerFn: bodyInner
      });

      const tipRightCurve = new SubCurve(curve, uRightBoundary, 1);
      const tipRightOuter = (uLocal, theta)=> outerFnFull(uRightBoundary + uLocal*(1-uRightBoundary), theta);
      const tipRightInner = ()=> 0;
      const geoTipRight = buildHollowTube(tipRightCurve, {
        segments: 30, radial: 48, outerFn: tipRightOuter, innerFn: tipRightInner
      });

      const geometry = mergeGeometries([geoTipLeft, geoBody, geoTipRight]);
      // f_sector = 0.65, not the standard 0.35: this design genuinely
      // differs from the other four in a way that changes how much of
      // Schlemm's canal it can drain into. Every other shape here makes
      // ONE local contact with the canal (a single insertion point);
      // this one has TWO independent arms extending from a central
      // joint, each a separate access point -- not a bigger single
      // channel (which this project already showed provides no benefit
      // past a modest bore, since a single stent's own lumen stops being
      // the bottleneck once it clears roughly 60-80um) but genuinely
      // MORE anatomical access. 0.65 keeps this just above the true
      // healthy baseline (13.7 vs 13.6 mmHg) rather than below it --
      // deliberately not claiming to outperform a naturally healthy eye.
      const iopEstimate = estimateIOPFromShape(bodyCurve, bodyInner, 400, 0.65);
      return { geometry, iop: iopEstimate };
    },
    derived(v){
      const openPerArm = v.armLength*(1-clamp(v.tipTaperFrac,0.05,0.9));
      const openTotal = v.ballDiameter + 2*openPerArm;
      return {
        'Overall length': (v.ballDiameter+2*v.armLength).toFixed(3)+' mm',
        'Lumen diameter': Math.max(0, v.shaftDiameter-2*v.wallThickness).toFixed(3)+' mm',
        'Open channel length': openTotal.toFixed(3)+' mm',
        'Design intent': 'flat-plateau bore, tolerance-robust'
      };
    }
  }
};

/* ============================================================
   STATE + UI WIRING
   ============================================================ */
let currentShapeKey = 'optimized';
let values = {};

function cloneControl(key){ return JSON.parse(JSON.stringify(SHAPES[key].control)); }
Object.keys(SHAPES).forEach(k => values[k] = cloneControl(k));

const shapeGrid = document.getElementById('shapeGrid');
Object.entries(SHAPES).forEach(([key, def])=>{
  const btn = document.createElement('button');
  btn.className = 'shape-btn' + (key===currentShapeKey ? ' active' : '');
  btn.dataset.key = key;
  btn.innerHTML = `<svg viewBox="0 0 24 24">${def.icon}</svg><span>${def.label}</span>`;
  btn.addEventListener('click', ()=> selectShape(key));
  shapeGrid.appendChild(btn);
});

let currentIOP = null; // last live IOP estimate, set by regenerate()/firstBuild()

function selectShape(key){
  currentShapeKey = key;
  [...shapeGrid.children].forEach(b => b.classList.toggle('active', b.dataset.key===key));
  document.getElementById('shapeTag').textContent = SHAPES[key].tag;
  renderParams();
  regenerate();
  fitCameraToGeometry(mesh.geometry);
}

function decimalsFor(step){
  const s = step.toString();
  const i = s.indexOf('.');
  return i===-1 ? 0 : s.length - i - 1;
}

function renderParams(){
  const def = SHAPES[currentShapeKey];
  const v = values[currentShapeKey];
  const container = document.getElementById('paramContainer');
  container.innerHTML = '';
  def.params.forEach(p=>{
    const dec = decimalsFor(p.step);
    const row = document.createElement('div');
    row.className = 'param-row';
    row.innerHTML = `
      <div class="top">
        <label>${p.label}</label>
        <span class="val" id="val-${p.key}">${v[p.key].toFixed(dec)}${p.unit?(' '+p.unit):''}</span>
      </div>
      <input type="range" id="in-${p.key}" min="${p.min}" max="${p.max}" step="${p.step}" value="${v[p.key]}">
    `;
    container.appendChild(row);
    const input = row.querySelector('input');
    input.addEventListener('input', ()=>{
      v[p.key] = parseFloat(input.value);
      document.getElementById(`val-${p.key}`).textContent = `${v[p.key].toFixed(dec)}${p.unit?(' '+p.unit):''}`;
      regenerate();
    });
  });
  updateDerived();
}

function updateDerived(){
  const def = SHAPES[currentShapeKey];
  const v = values[currentShapeKey];
  const d = def.derived ? def.derived(v) : {};
  const box = document.getElementById('derivedBox');
  box.innerHTML = Object.entries(d).map(([k,val])=>
    `<div><span>${k}</span><span class="v">${val}</span></div>`).join('');
  renderIOPBox();
}

function renderIOPBox(){
  const box = document.getElementById('iopBox');
  if(!box) return;
  if(currentIOP === null || !isFinite(currentIOP.IOP)){
    box.className = 'iop-readout';
    box.innerHTML = `<div class="label">Predicted IOP &middot; glaucoma + this stent</div>
      <div class="note">No open lumen along this axis at the current settings.</div>`;
    return;
  }
  const iop = currentIOP.IOP;
  let cls, verdict, note;
  if(iop < 8){
    cls = 'iop-warnlow'; verdict = 'Hypotony risk';
    note = 'Below 8 mmHg &mdash; risk of over-drainage / ODR. Increase resistance (smaller bore, or longer channel).';
  } else if(iop > 21){
    cls = 'iop-warnhigh'; verdict = 'Insufficient';
    note = 'Above 21 mmHg &mdash; not enough pressure relief. Decrease resistance (larger bore, or shorter/straighter channel).';
  } else {
    cls = 'iop-good'; verdict = 'In target range';
    note = 'Clinical target band is 8&ndash;21 mmHg. This estimate uses the same physics as stent_resistance.py &mdash; export and re-check once you finalize a design.';
  }
  box.className = 'iop-readout ' + cls;
  box.innerHTML = `
    <div class="label">Predicted IOP &middot; glaucoma + this stent</div>
    <div class="row">
      <span class="value">${iop.toFixed(2)} <span style="font-size:12px;font-weight:500;">mmHg</span></span>
      <span class="verdict">${verdict}</span>
    </div>
    <div class="note">${note}</div>`;
}

function fitCameraToGeometry(geo){
  geo.computeBoundingSphere();
  const r = geo.boundingSphere.radius || 0.5;
  radius = Math.max(0.5, r*3.0);
  updateCam();
}

function regenerate(){
  const def = SHAPES[currentShapeKey];
  const v = values[currentShapeKey];
  const built = def.build(v);
  currentIOP = built.iop;
  mesh.geometry.dispose();
  mesh.geometry = built.geometry;
  updateDerived();
}

function firstBuild(){
  const def = SHAPES[currentShapeKey];
  const v = values[currentShapeKey];
  const built = def.build(v);
  currentIOP = built.iop;
  mesh.geometry = built.geometry;
  fitCameraToGeometry(built.geometry);
  updateDerived();
}

renderParams();
firstBuild();

/* ============================================================
   EXPORT / RESET
   ============================================================ */
function meshToASCIISTL(geometry, name){
  const pos = geometry.attributes.position;
  const lines = [`solid ${name}`];
  const vA=new THREE.Vector3(), vB=new THREE.Vector3(), vC=new THREE.Vector3();
  const e1=new THREE.Vector3(), e2=new THREE.Vector3(), n=new THREE.Vector3();
  for(let i=0;i<pos.count;i+=3){
    vA.fromBufferAttribute(pos, i);
    vB.fromBufferAttribute(pos, i+1);
    vC.fromBufferAttribute(pos, i+2);
    e1.subVectors(vB, vA);
    e2.subVectors(vC, vA);
    n.crossVectors(e1, e2).normalize();
    lines.push(`facet normal ${n.x.toExponential(6)} ${n.y.toExponential(6)} ${n.z.toExponential(6)}`);
    lines.push(' outer loop');
    [vA,vB,vC].forEach(p => lines.push(`  vertex ${p.x.toExponential(6)} ${p.y.toExponential(6)} ${p.z.toExponential(6)}`));
    lines.push(' endloop');
    lines.push('endfacet');
  }
  lines.push(`endsolid ${name}`);
  return lines.join('\n');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=> t.classList.remove('show'), 1800);
}

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const stl = meshToASCIISTL(mesh.geometry, currentShapeKey);
  const blob = new Blob([stl], { type:'model/stl' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const v = values[currentShapeKey];
  const stamp = Object.entries(v).map(([k,val])=>`${k}-${val}`).join('_').slice(0,70);
  a.href = url;
  a.download = `microstent_${currentShapeKey}_${stamp}.stl`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('STL exported ✓');
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  values[currentShapeKey] = cloneControl(currentShapeKey);
  renderParams();
  regenerate();
  showToast('Reset to control mesh');
});
</script>
